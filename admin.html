<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Banner Admin</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
<style>
body{background:#111;color:#fff;font-family:Arial;padding:20px}
input,button{padding:10px;margin:5px;border-radius:5px;border:none}
button{background:#ffc107;color:#000;font-weight:bold;cursor:pointer}
.box{border:1px solid #333;padding:15px;margin:10px 0;border-radius:8px}
img{max-width:300px;margin-top:10px;border-radius:5px}
</style>
</head>
<body>
<h2>Banner Upload</h2>
<div class="box">
  <input type="file" id="bannerFile" accept="image/*">
  <button onclick="uploadBanner()">Upload Banner</button>
  <div id="preview"></div>
</div>

<h3>Existing Banners</h3>
<div id="bannerList"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAwTPtmSGvThVxDM7uc-ey-SjD4500KJeI",
  authDomain: "play25agent.firebaseapp.com",
  projectId: "play25agent",
  storageBucket: "play25agent.firebasestorage.app",
  messagingSenderId: "1074050564633",
  appId: "1:1074050564633:web:eef2b39ef0b7b745dae088"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function uploadBanner(){
  const file = document.getElementById('bannerFile').files[0];
  if(!file) return alert('ছবি সিলেক্ট করুন');

  const reader = new FileReader();
  reader.onload = function(e){
    db.collection("banners").add({
      image: e.target.result,
      createdAt: new Date()
    }).then(()=>{alert('Upload Success'); loadBanners();})
  }
  reader.readAsDataURL(file);
}

function loadBanners(){
  db.collection("banners").get().then(snap=>{
    let html = '';
    snap.forEach(doc=>{
      html += `<div class="box"><img src="${doc.data().image}"><br>
      <button onclick="db.collection('banners').doc('${doc.id}').delete().then(loadBanners)">Delete</button></div>`
    })
    document.getElementById('bannerList').innerHTML = html;
  })
}
loadBanners();
</script>
</body>
</html>
