<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAY25 - Betting Site</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a0a0a;color:#fff;padding-bottom:70px}
/* Header */
.header{display:flex;justify-content:space-between;align-items:center;background:#1a1a1a;padding:8px 12px;position:sticky;top:0;z-index:100}
.logo{font-size:24px;font-weight:bold;color:#ffc107}
.logo span{color:#fff}
.btn{padding:8px 15px;border:none;border-radius:5px;font-weight:bold;cursor:pointer}
.btn-agent{background:#ffc107;color:#000}
.btn-login{background:#dc3545;color:#fff}
/* Slider */
.slider{position:relative;width:100%;height:180px;overflow:hidden}
.slide{position:absolute;width:100%;height:100%;background-size:cover;background-position:center;opacity:0;transition:1s}
.slide.active{opacity:1}
.dots{position:absolute;bottom:10px;width:100%;text-align:center}
.dot{height:8px;width:8px;margin:0 3px;background:rgba(255,255,255,0.5);border-radius:50%;display:inline-block}
.dot.active{background:#ffc107}
/* Menu */
.menu{display:flex;justify-content:space-around;background:#222;padding:10px 0}
.menu-item{text-align:center;font-size:12px;color:#ccc;cursor:pointer}
.menu-item i{font-size:22px;display:block;margin-bottom:4px;color:#ffc107}
/* Sports */
.section-title{background:#1a1a1a;padding:10px;font-weight:bold;border-left:4px solid #ffc107}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px;background:#111}
.card{background:#222;border-radius:8px;padding:15px 5px;text-align:center;font-size:12px}
.card i{font-size:28px;margin-bottom:5px;color:#ffc107}
/* Bottom Nav */
.bottom-nav{position:fixed;bottom:0;left:0;width:100%;background:#1a1a1a;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #333;z-index:100}
.nav-item{text-align:center;font-size:10px;color:#aaa;cursor:pointer}
.nav-item i{font-size:20px;display:block;margin-bottom:3px}
.nav-item.active{color:#ffc107}
.support{position:fixed;bottom:80px;right:15px;background:#ffc107;color:#000;padding:10px;border-radius:50%;font-weight:bold;z-index:99}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="logo">PLAY<span>25</span></div>
  <div>
    <button class="btn btn-agent">Agent List</button>
    <button class="btn btn-login">Login</button>
  </div>
</div>

<!-- Banner Slider -->
<div class="slider" id="bannerSlider"></div>

<!-- Menu -->
<div class="menu">
  <div class="menu-item"><i class="fa fa-futbol"></i>Sports</div>
  <div class="menu-item"><i class="fa fa-dice"></i>Casino</div>
  <div class="menu-item"><i class="fa fa-slot-machine"></i>Slots</div>
  <div class="menu-item"><i class="fa fa-table"></i>Table</div>
  <div class="menu-item"><i class="fa fa-rocket"></i>Crash</div>
</div>

<!-- Sports Section -->
<div class="section-title">| Sport</div>
<div class="grid">
  <div class="card"><i class="fa fa-cricket"></i><br>Cricket</div>
  <div class="card"><i class="fa fa-9"></i><br>9wickets</div>
  <div class="card"><i class="fa fa-futbol"></i><br>Soccer</div>
  <div class="card"><i class="fa fa-table-tennis"></i><br>Tennis</div>
  <div class="card"><i class="fa fa-gamepad"></i><br>ESports</div>
  <div class="card"><i class="fa fa-horse"></i><br>Horsebook</div>
  <div class="card"><i class="fa fa-dove"></i><br>SV388</div>
  <div class="card"><i class="fa fa-chart-line"></i><br>PINN</div>
</div>

<div class="support">Support</div>

<!-- Bottom Nav -->
<div class="bottom-nav">
  <div class="nav-item"><i class="fa fa-exchange-alt"></i>Exch</div>
  <div class="nav-item"><i class="fa fa-play-circle"></i>In Play</div>
  <div class="nav-item active"><i class="fa fa-home"></i>Home</div>
  <div class="nav-item"><i class="fa fa-users"></i>Referral</div>
  <div class="nav-item"><i class="fa fa-user"></i>Account</div>
</div>

<script>
// তোমার FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyAwTPtmSGvThVxDM7uc-ey-SjD4500KJeI",
  authDomain: "play25agent.firebaseapp.com",
  projectId: "play25agent",
  storageBucket: "play25agent.firebasestorage.app",
  messagingSenderId: "1074050564633",
  appId: "1:1074050564633:web:eef2b39ef0b7b745dae088"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let currentSlide = 0;
let slides = [];

db.collection("banners").orderBy(firebase.firestore.FieldPath.documentId()).get().then(snap=>{
  if(snap.empty){
    document.getElementById('bannerSlider').innerHTML = '<div style="text-align:center;padding-top:70px">admin.html থেকে Banner Add করুন</div>';
    return;
  }
  let html = '';
  snap.forEach(doc=>{
    let d = doc.data();
    if(d.image){
      html += `<div class="slide" style="background-image:url('${d.image}')"></div>`
    }
  })
  let dotHtml = '<div class="dots">';
  for(let i=0; i<snap.size; i++) dotHtml += `<span class="dot"></span>`;
  dotHtml += '</div>';
  document.getElementById('bannerSlider').innerHTML = html + dotHtml;
  slides = document.querySelectorAll('.slide');
  showSlide(0);
  setInterval(nextSlide, 4000);
})

function showSlide(n){
  slides.forEach(slide => slide.classList.remove('active'));
  document.querySelectorAll('.dot').forEach(dot => dot.classList.remove('active'));
  slides[n].classList.add('active');
  document.querySelectorAll('.dot')[n].classList.add('active');
}
function nextSlide(){
  currentSlide = (currentSlide + 1) % slides.length;
  showSlide(currentSlide);
}
</script>

</body>
</html>
