<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>play25.com - Home</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial, sans-serif;background:#000}
.slider{position:relative;width:100%;height:300px;overflow:hidden;background:#222}
.slide{position:absolute;top:0;left:0;width:100%;height:100%;background-size:cover;background-position:center;display:flex;flex-direction:column;justify-content:flex-end;padding:25px;color:white;opacity:0;transition:opacity 1s ease-in-out}
.slide.active{opacity:1}
.slide::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 60%)}
.slide h1{font-size:24px;margin-bottom:5px;z-index:2;position:relative}
.slide p{font-size:14px;z-index:2;position:relative}
.dots{position:absolute;bottom:15px;width:100%;text-align:center;z-index:3}
.dot{height:10px;width:10px;margin:0 5px;background:rgba(255,255,255,0.5);border-radius:50%;display:inline-block;cursor:pointer;transition:0.3s}
.dot.active{background:#fff}
.loading{color:#aaa;text-align:center;padding-top:120px;font-size:16px}
</style>
</head>
<body>

<div class="slider" id="bannerSlider">
  <div class="loading">Loading Banners...</div>
</div>

<script>
// তোমার FIREBASE CONFIG - admin.html এর টাই
const firebaseConfig = {
  apiKey: "AIzaSyAwTPtmSGvThVxDM7uc-ey-SjD4500KJeI",
  authDomain: "play25agent.firebaseapp.com",
  projectId: "play25agent",
  storageBucket: "play25agent.firebasestorage.app",
  messagingSenderId: "1074050564633",
  appId: "1:1074050564633:web:eef2b39ef0b7b745dae088"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let currentSlide = 0;
let slides = [];

db.collection("banners").orderBy(firebase.firestore.FieldPath.documentId()).get().then(snap=>{
  if(snap.empty){
    document.getElementById('bannerSlider').innerHTML = '<div class="loading">No Banners Found. Go to admin.html and Save</div>';
    return;
  }

  let html = '';
  snap.forEach(doc=>{
    let d = doc.data();
    if(d.image){
      html += `<div class="slide" style="background-image:url('${d.image}')">
        <h1>${d.title || ''}</h1>
        <p>${d.subtitle || ''}</p>
      </div>`
    }
  })

  // Dots
  let dotHtml = '<div class="dots">';
  for(let i=0; i<snap.size; i++) dotHtml += `<span class="dot" onclick="showSlide(${i})"></span>`;
  dotHtml += '</div>';

  document.getElementById('bannerSlider').innerHTML = html + dotHtml;
  slides = document.querySelectorAll('.slide');
  showSlide(0);
  setInterval(nextSlide, 4000); // 4 সেকেন্ড পর পর Auto Change
})

function showSlide(n){
  slides.forEach(slide => slide.classList.remove('active'));
  document.querySelectorAll('.dot').forEach(dot => dot.classList.remove('active'));
  if(slides[n]){
    slides[n].classList.add('active');
    document.querySelectorAll('.dot')[n].classList.add('active');
    currentSlide = n;
  }
}

function nextSlide(){
  currentSlide = (currentSlide + 1) % slides.length;
  showSlide(currentSlide);
}
</script>

</body>
</html>
