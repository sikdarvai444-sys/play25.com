<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>play25.com</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial, sans-serif;background:#111}
.slider{position:relative;width:100%;height:320px;overflow:hidden}
.slide{position:absolute;width:100%;height:100%;background-size:cover;background-position:center;display:flex;flex-direction:column;justify-content:end;padding:20px;color:white;opacity:0;transition:opacity 1s ease-in-out;text-shadow:2px 2px 6px rgba(0,0,0,0.8)}
.slide.active{opacity:1}
.slide h1{font-size:28px;margin-bottom:5px}
.slide p{font-size:16px}
.dots{position:absolute;bottom:15px;width:100%;text-align:center}
.dot{height:10px;width:10px;margin:0 4px;background:#bbb;border-radius:50%;display:inline-block;cursor:pointer}
.dot.active{background:#fff}
.loading{color:white;text-align:center;padding:50px}
</style>
</head>
<body>

<div class="slider" id="bannerSlider">
  <div class="loading">Loading Banners...</div>
</div>

<script>
// তোমার FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyAwTPtmSGvThVxDM7uc-ey-SjD4500KJeI",
  authDomain: "play25agent.firebaseapp.com",
  projectId: "play25agent",
  storageBucket: "play25agent.firebasestorage.app",
  messagingSenderId: "1074050564633",
  appId: "1:1074050564633:web:eef2b39ef0b7b745dae088"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let currentSlide = 0;
let slides = [];
let interval;

db.collection("banners").orderBy(firebase.firestore.FieldPath.documentId()).get().then(snap=>{
  let html = '';
  snap.forEach(doc=>{
    let d = doc.data();
    if(d.image){
      html += `<div class="slide" style="background-image:linear-gradient(to top, rgba(0,0,0,0.7), transparent), url('${d.image}')">
        <h1>${d.title || ''}</h1>
        <p>${d.subtitle || ''}</p>
      </div>`
    }
  })

  if(html === '') {
    document.getElementById('bannerSlider').innerHTML = '<div class="loading">No Banners Found. Go to admin.html and Save</div>';
    return;
  }

  // dots add
  let dotHtml = '<div class="dots">';
  for(let i=0; i<snap.size; i++) dotHtml += `<span class="dot" onclick="showSlide(${i})"></span>`;
  dotHtml += '</div>';

  document.getElementById('bannerSlider').innerHTML = html + dotHtml;
  slides = document.querySelectorAll('.slide');
  showSlide(0);
  startSlider();
})

function showSlide(n){
  slides.forEach(slide => slide.classList.remove('active'));
  document.querySelectorAll('.dot').forEach(dot => dot.classList.remove('active'));
  slides[n].classList.add('active');
  document.querySelectorAll('.dot')[n].classList.add('active');
  currentSlide = n;
}

function nextSlide(){
  currentSlide = (currentSlide + 1) % slides.length;
  showSlide(currentSlide);
}

function startSlider(){
  interval = setInterval(nextSlide, 4000); // 4 সেকেন্ড পর Change হবে
}
</script>

</body>
</html>
