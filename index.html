<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PLAY25 BETTING</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#0b1020;color:#fff;padding-bottom:70px;}
.header{display:flex;justify-content:space-between;align-items:center;padding:8px;background:#0f1530;position:sticky;top:0;z-index:99;}
.logo{font-size:22px;font-weight:bold;color:#00d4ff;}
.logo span{color:#ffcc00;}
.btn{display:flex;gap:6px;}
.btn a{padding:6px 12px;border-radius:6px;text-decoration:none;font-size:12px;font-weight:bold;}
.agent{background:#333;color:#fff;}
.login{background:#ff3b3b;color:#fff;}
.banner{background:linear-gradient(90deg,#ff6a00,#ff006a);padding:15px;text-align:center;border-radius:10px;margin:8px;position:relative;overflow:hidden;}
.banner h2{font-size:18px;}
.banner p{font-size:10px;margin-top:4px;}
.menu-tabs{display:flex;overflow-x:auto;background:#111a3a;padding:8px;gap:15px;white-space:nowrap;}
.menu-tabs a{color:#aaa;text-decoration:none;font-size:13px;padding-bottom:4px;}
.menu-tabs a.active{color:#00d4ff;border-bottom:2px solid #00d4ff;}
.section{padding:10px;}
.section-title{font-size:14px;margin-bottom:8px;color:#ffcc00;}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.game-box{background:#1a2347;border-radius:8px;padding:10px;text-align:center;font-size:11px;}
.game-box img{width:40px;height:40px;margin-bottom:5px;}
.bottom-nav{position:fixed;bottom:0;left:0;width:100%;background:#0f1530;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #222;}
.bottom-nav a{color:#aaa;text-decoration:none;font-size:10px;text-align:center;}
.bottom-nav a.active{color:#00d4ff;}
.login-popup{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);justify-content:center;align-items:center;z-index:999;}
.login-box{background:#1a2347;padding:20px;border-radius:10px;width:90%;max-width:350px;}
.login-box input{width:100%;padding:10px;margin:8px 0;border:none;border-radius:5px;background:#0b1020;color:#fff;}
.login-box button{width:100%;padding:10px;background:#ff3b3b;border:none;color:#fff;border-radius:5px;font-weight:bold;}
.support-btn{position:fixed;bottom:80px;right:15px;background:#ffcc00;color:#000;padding:10px 15px;border-radius:20px;font-weight:bold;text-decoration:none;font-size:12px;}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
    <div class="logo">PLAY<span>25</span></div>
    <div class="btn">
        <a href="#" class="agent">Agent List</a>
        <a href="#" onclick="openLogin()" class="login">Login</a>
    </div>
</div>

<!-- BANNER -->
<div class="banner">
    <h2>🎡 SPIN & WIN</h2>
    <p>প্রতি রেফারেলে 4% বোনাস + 200 টাকা ফ্রি</p>
</div>

<!-- MENU TABS -->
<div class="menu-tabs">
    <a href="#" class="active">Sports</a>
    <a href="#">Casino</a>
    <a href="#">Slots</a>
    <a href="#">Table</a>
    <a href="#">Crash</a>
    <a href="#">Lottery</a>
    <a href="#">Fishing</a>
</div>

<!-- SPORTS SECTION -->
<div class="section">
    <div class="section-title">| Sport</div>
    <div class="grid">
        <div class="game-box">🏏<br>Cricket</div>
        <div class="game-box">9️⃣<br>9wickets</div>
        <div class="game-box">⚽<br>Soccer</div>
        <div class="game-box">🎾<br>Tennis</div>
        <div class="game-box">🎮<br>ESports</div>
        <div class="game-box">🐎<br>Horsebook</div>
        <div class="game-box">🐓<br>SV388</div>
        <div class="game-box">📌<br>PINNACLE</div>
    </div>
</div>

<!-- SUPPORT -->
<a href="#" class="support-btn">🎧 Support</a>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
    <a href="#">Exch</a>
    <a href="#">In Play</a>
    <a href="#" class="active">Home</a>
    <a href="#">Referral</a>
    <a href="#">Account</a>
</div>

<!-- LOGIN POPUP -->
<div class="login-popup" id="loginPopup">
    <div class="login-box">
        <h3 style="text-align:center;margin-bottom:10px;">LOGIN</h3>
        <input type="text" placeholder="Username">
        <input type="password" placeholder="Password">
        <input type="text" placeholder="Validation Code: 3983">
        <button>Login</button>
        <p style="text-align:center;margin-top:10px;font-size:10px;" onclick="closeLogin()">Close X</p>
    </div>
</div>

<script>
function openLogin(){document.getElementById('loginPopup').style.display='flex';}
function closeLogin(){document.getElementById('loginPopup').style.display='none';}
</script>

</body>
</html>
