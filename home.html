<!DOCTYPE html>
<html>
<head>
<title>play25.com</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
body{margin:0;font-family:Arial}
.banner{width:100%;height:300px;background-size:cover;background-position:center;color:white;display:flex;flex-direction:column;justify-content:center;padding:30px;box-sizing:border-box;text-shadow:2px 2px 4px #000}
.banner h1{margin:0;font-size:40px}
.banner p{margin:5px 0;font-size:18px}
</style>
</head>
<body>
<div id="bannerSlider">Loading...</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAwTPtmSGvThVxDM7uc-ey-SjD4500KJeI",
  authDomain: "play25agent.firebaseapp.com",
  projectId: "play25agent",
  storageBucket: "play25agent.firebasestorage.app",
  messagingSenderId: "1074050564633",
  appId: "1:1074050564633:web:eef2b39ef0b7b745dae088"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

db.collection("banners").orderBy(firebase.firestore.FieldPath.documentId()).get().then(snap=>{
  let html = '';
  snap.forEach(doc=>{
    let d = doc.data();
    if(d.image){
      html += `<div class="banner" style="background-image:linear-gradient(rgba(0,0,0,0.4),rgba(0,0,0,0.4)),url('${d.image}')">
        <h1>${d.title || ''}</h1>
        <p>${d.subtitle || ''}</p>
      </div>`
    }
  })
  document.getElementById('bannerSlider').innerHTML = html || "No banners found";
})
</script>
</body>
</html>
